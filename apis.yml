name: Partsimony
description: >-
  Partsimony is an intelligent supply chain platform that helps hardware
  companies turn engineering designs into manufactured products with less time,
  cost, and friction. Its software analyzes component designs to recommend
  manufacturing methods, materials, price estimates, and lead times, then
  matches each part to the optimal manufacturers inside and outside a company's
  network — batching components for volume leverage across processes like 3D
  printing, CNC machining, injection molding, castings, electronics, and
  assemblies. The platform also coordinates RFPs, proposals, orders, messaging,
  and payment terms between OEMs and their manufacturing partners. Partsimony
  operates a web application and product documentation but does not currently
  publish a public developer API. Founded in 2015 and based in Brooklyn, NY;
  backed by Techstars.
